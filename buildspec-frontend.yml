version: 0.2
# S3_BUCKET and CF_DISTRIBUTION_ID are set in the CodeBuild project (console), not here.
phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - cd frontend
      - npm install
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - aws s3 sync dist/ s3://$S3_BUCKET/ --delete
      - aws cloudfront create-invalidation
        --distribution-id $CF_DISTRIBUTION_ID --paths "/*"
